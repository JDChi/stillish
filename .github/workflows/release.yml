name: Release Stillish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Validate version tag
        run: |
          bun -e '
            const tag = process.env.GITHUB_REF_NAME;
            const version = (await Bun.file("package.json").json()).version;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag ?? "") || tag !== "v" + version) {
              console.error("Expected a version tag matching package.json, got " + tag + " for " + version);
              process.exit(1);
            }
          '

      - name: Prepare build and test dependencies
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            brew install ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
          bun install --frozen-lockfile

      - name: Verify source and browser-target core
        run: |
          bun run check
          bun run test:browser
          bun test packages/core apps/cli/tests/dependencies.test.ts

      - name: Build the standalone CLI
        run: bun run build:cli

      - name: Verify the packaged CLI
        run: |
          test "$(lipo -archs apps/cli/dist/stillish)" = arm64
          apps/cli/dist/stillish --help
          apps/cli/dist/stillish --license
          STILLISH_TEST_BINARY=apps/cli/dist/stillish bun test apps/cli/tests/cli.test.ts

      - name: Prepare release files
        working-directory: apps/cli/dist
        run: |
          cp -p stillish stillish-macos-arm64
          shasum -a 256 stillish-macos-arm64 > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release already exists for $GITHUB_REF_NAME."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "Stillish $GITHUB_REF_NAME" \
            apps/cli/dist/stillish-macos-arm64 apps/cli/dist/SHA256SUMS.txt
