[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stillish"
version = "0.1.0"
description = "Convert MP4 to Apple Live Photo or Android Motion Photo"
requires-python = ">=3.10"
dependencies = ["Pillow>=11.3,<13", "certifi"]

[project.optional-dependencies]
build = ["PyInstaller==6.22.0"]

[project.scripts]
stillish = "stillish.cli:main"

[tool.setuptools.package-data]
stillish = ["licenses/*.txt"]
